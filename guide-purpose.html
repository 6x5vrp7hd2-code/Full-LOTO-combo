<template id="gc"><div data-k="eb">01 / PURPOSE</div><div data-k="h1">Why the system exists</div><div data-k="lead">Reduce time lost tracing isolation keys, lockout boxes and safety-document recipients, and keep the AP office aligned with the day’s plan.</div><div data-k="body"><div class="grid two"><article class="panel"><h3>The problem</h3><p>On large data-centre projects, multiple APs can work across the same electrical system. Keys, lockout boxes and live documents may become difficult to locate. The resulting searches can delay planned work, switching and energisation.</p></article><article class="panel"><h3>The proposed answer</h3><p>Standardise the physical locations and identification of locks and keys, then link their custody to the document and the responsible AP/CP in an accessible application.</p></article><article class="panel"><h3>The coordination problem</h3><p>Requests can reach the AP office with too little information, and the priorities agreed at the morning meeting may not reach every AP. A document could then be issued on equipment needed for commissioning later that day.</p></article><article class="panel"><h3>The added controls</h3><p>Every document now starts with a reviewed contractor request, and all APs and SAPs share a published daily programme showing deadlines and equipment that cannot be released.</p></article></div><div class="note"><strong>Three elements working together:</strong> <p>1. A defined, physical LOTO and key-custody system. 2. A supporting digital register for people, assets, keys, lockout boxes and documents. 3. A controlled route for requests and a shared daily programme.</p></div><a class="btn primary small guide-next" href="guide-setup.html">Next: Set up the site →</a></div></template>
