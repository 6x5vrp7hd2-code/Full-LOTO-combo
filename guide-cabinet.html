<template id="gc"><div data-k="eb">03 / PHYSICAL CUSTODY</div><div data-k="h1">The four-cabinet system</div><div data-k="lead">Four LOTO cabinets are located together so keys and lockout boxes always have designated positions.</div><div data-k="body"><div class="grid four"><article class="panel"><span class="eyebrow">HV KEYS</span><h3>Cabinet 1</h3><div class="badge hv">HV</div><p>Dedicated HV isolation-lock keys, each on its numbered hook.</p></article><article class="panel"><span class="eyebrow">LV KEYS</span><h3>Cabinet 2</h3><div class="badge lv">LV</div><p>Dedicated LV isolation-lock keys, each on its numbered hook.</p></article><article class="panel"><span class="eyebrow">LOCKOUT BOXES</span><h3>Cabinet 3</h3><div class="badge lb">LB</div><p>All numbered lockout boxes, each returned to its assigned position after use.</p></article><article class="panel"><span class="eyebrow">BOX-LOCK KEYS</span><h3>Cabinet 4</h3><div class="badge restricted">AP</div><p>The safety-lock key of each lockout box while that box is in use.</p></article></div><div class="grid two"><article class="panel"><h3>Your Cabinet 4 key</h3><p>Each AP and SAP signs for their own copy of the key to Cabinet 4. It is theirs and they must guard it. Management status alone does not confer access: anyone without the required AP/SAP authorisation is excluded.</p></article><article class="panel"><h3>Missing key hook</h3><p>If an isolation key is removed, a tag is left on its numbered hook indicating where it has gone and why. This is a physical courtesy indicator; the full record is held in the application. A missing key with no valid reconciliation prevents the proposed document issue.</p></article></div><div class="note"><strong>Key distinction:</strong><p>The Cabinet 4 key opens Cabinet 4 only. It is not a universal isolation-lock key and must never be used as a bypass of individual isolation or personal-lock control.</p></div><a class="btn primary small guide-next" href="guide-who-does-what.html">Next: Who does what →</a></div></template>
