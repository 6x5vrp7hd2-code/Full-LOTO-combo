<template id="gc"><div data-k="eb">10 / WORKED EXAMPLE</div><div data-k="h1">A day on site</div><div data-k="lead">One invented example, following a single energisation and a contractor request through the working day.</div><div data-k="body"><div class="timeline"><article class="timeline-item"><span class="step-num">08:00</span><div><h3>Coordination meeting</h3><p>The Lead SAP learns that Ring 1 is scheduled for energisation at 15:00, and the equipment must be available by 13:00. They enter it and publish the programme.</p></div></article><article class="timeline-item"><span class="step-num">08:30</span><div><h3>Contractor requests a document</h3><p>A contractor submits a request to work on equipment on Ring 1, from 09:00 to 16:00.</p></div></article><article class="timeline-item"><span class="step-num">08:31</span><div><h3>The application flags a conflict</h3><p>The requested time overlaps the planned energisation, so the AP office sees a conflict against the request.</p></div></article><article class="timeline-item"><span class="step-num">09:00</span><div><h3>The AP reviews the request</h3><p>The AP discusses the work with the contractor and the person responsible for coordination. The request is deferred or revised to fit the agreed programme.</p></div></article><article class="timeline-item"><span class="step-num">11:00</span><div><h3>Existing documents are reviewed</h3><p>Clearance deadlines shows the documents that must be cleared before 13:00. The AP contacts each recipient.</p></div></article><article class="timeline-item"><span class="step-num">13:00</span><div><h3>Clearance target</h3><p>The AP office checks the status of the documents and isolation arrangements. Any outstanding restriction is escalated.</p></div></article><article class="timeline-item"><span class="step-num">15:00</span><div><h3>Planned energisation</h3><p>This proceeds only when all required switching, safety-document, isolation, equipment and operational checks have been completed under the applicable safety rules.</p></div></article></div><div class="note"><strong>The full chain:</strong><p>Contractor request → AP/SAP review → programme conflict check → isolation planning → safety document issue → live monitoring → document cancellation → equipment reconciliation.</p></div><div class="warning"><strong>The application provides coordination and visibility.</strong><p>It does not replace the Control Engineer’s authority or the approved switching process.</p></div><a class="btn primary small guide-next" href="guide-app.html">Next: How the app supports this →</a></div></template>
