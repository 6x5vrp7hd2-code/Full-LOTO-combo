<template id="gc"><div data-k="eb">04 / ROLES</div><div data-k="h1">Who does what</div><div data-k="lead">Everyone in the process has a defined part. Knowing where yours starts and stops is the first thing to learn.</div><div data-k="body"><div class="grid two"><article class="panel"><span class="eyebrow">REQUESTS</span><h3>Contractor</h3><p>Submits a document request with the equipment, work, RAMS reference, proposed recipient and required times. Sees their own requests and the AP office comments. Replies if more information is needed.</p></article><article class="panel"><span class="eyebrow">RECEIVES THE DOCUMENT</span><h3>Competent Person (CP)</h3><p>Receives the safety document, keeps the working party within its limits, and is responsible for their own numbered personal lock and its key.</p></article><article class="panel"><span class="eyebrow">REVIEWS AND ISSUES</span><h3>Authorised Person (AP)</h3><p>Reviews requests within their authorisation, plans isolations, issues and cancels safety documents, keeps the keys, boxes and records reconciled, and guards their own signed-for Cabinet 4 key.</p></article><article class="panel"><span class="eyebrow">REVIEWS AND ISSUES</span><h3>Senior Authorised Person (SAP)</h3><p>Carries out the AP duties within their authorisation. The site decides any further responsibilities. Being a SAP does not automatically make someone the Lead SAP.</p></article><article class="panel"><span class="eyebrow">PLANS AND COORDINATES</span><h3>Lead SAP or Control Engineer</h3><p>Attends the morning coordination meeting, publishes the daily programme, and is the only role that can record a resolution to a programme conflict.</p></article><article class="panel"><span class="eyebrow">VIEW ONLY</span><h3>Management</h3><p>Can view status and records. A management position does not give electrical authority or the right to change a record.</p></article></div><h2>Who can do what in the application</h2><div class="table-wrap"><table class="info"><thead><tr><th>Action</th><th>Contractor</th><th>AP / SAP</th><th>Lead SAP / Control Engineer</th><th>Management</th></tr></thead><tbody><tr><td data-label="Action">Submit a document request</td><td data-label="Contractor">Yes</td><td data-label="AP / SAP">Yes</td><td data-label="Lead SAP / Control Engineer">Yes</td><td data-label="Management">No</td></tr><tr><td data-label="Action">Review a request</td><td data-label="Contractor">No</td><td data-label="AP / SAP">Yes, within authorisation</td><td data-label="Lead SAP / Control Engineer">Yes, within authorisation</td><td data-label="Management">No</td></tr><tr><td data-label="Action">Issue or cancel a safety document</td><td data-label="Contractor">No</td><td data-label="AP / SAP">Yes, within authorisation</td><td data-label="Lead SAP / Control Engineer">Yes, within authorisation</td><td data-label="Management">No</td></tr><tr><td data-label="Action">Publish the daily programme</td><td data-label="Contractor">No</td><td data-label="AP / SAP">No</td><td data-label="Lead SAP / Control Engineer">Yes</td><td data-label="Management">No</td></tr><tr><td data-label="Action">Resolve a programme conflict</td><td data-label="Contractor">No</td><td data-label="AP / SAP">No</td><td data-label="Lead SAP / Control Engineer">Yes, with a recorded reason</td><td data-label="Management">No</td></tr><tr><td data-label="Action">View registers and the programme</td><td data-label="Contractor">Own requests only</td><td data-label="AP / SAP">Yes</td><td data-label="Lead SAP / Control Engineer">Yes</td><td data-label="Management">Yes</td></tr></tbody></table></div><div class="note"><strong>This table shows the demonstration.</strong><p>Live permissions must follow the site’s approved authority structure, and each person’s authorisation still applies.</p></div><a class="btn primary small guide-next" href="guide-daily-programme.html">Next: The daily programme →</a></div></template>
