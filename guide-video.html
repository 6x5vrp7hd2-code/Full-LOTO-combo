<template id="gc"><div data-k="eb">14 / VIDEO SCRIPTS</div><div data-k="h1">Video scripts</div><div data-k="lead">Two short, distinct video scripts explain the same process for different audiences.</div><div data-k="body"><div class="grid two"><article class="panel"><h3>Engineer induction</h3><p>A practical explanation for someone joining mid-project: why the process exists, where each cabinet is, how a CP signs for a lock, what the AP checks, how the box is secured, and how a document is cancelled.</p></article><article class="panel"><h3>Client overview</h3><p>Explains the recurring operational problem, the four-cabinet standard, searchable records, expected reduction in wasted searching and the safeguards needed before a controlled pilot.</p></article></div><h2>Video-ready storyboard</h2><div class="tabs"><button class="tab selected" data-video="induction">Engineer induction</button><button class="tab" data-video="client">Client presentation</button></div><div id="storyboard" class="timeline"></div><button class="btn primary small" onclick="window.print()">Print storyboard</button><div class="note"><strong>Value proposition:</strong><p>The intended benefit is quicker retrieval and better accountability, not relaxation of electrical safety controls. Any savings should be measured in a client pilot rather than asserted without evidence.</p></div><a class="btn primary small guide-next" href="guide-demo-video.html">Next: Watch the demo video →</a></div></template>
