<template id="gc"><div data-k="eb">02 / SITE SETUP</div><div data-k="h1">Set up the site</div><div data-k="lead">Establish the lock numbers, cabinet arrangement, personal locks and approved drawings before the site comes under safety rules.</div><div data-k="body"><div class="grid two"><article class="panel"><span class="eyebrow">RULE 01</span><h3>Dedicated apparatus locks</h3><p>Every designated HV and LV switch, circuit breaker and earth switch has its own uniquely numbered dedicated lock. Prior to the system coming under safety rules, each intended lock is fitted to its assigned apparatus and its identification is verified.</p></article><article class="panel"><span class="eyebrow">RULE 02</span><h3>Numbered lockout boxes</h3><p>Every lockout box has a unique number and its own associated lock bearing the same number.</p></article><article class="panel"><span class="eyebrow">RULE 03</span><h3>CP personal safety locks</h3><p>Each CP is issued a uniquely identified personal safety lock after completing CP training. The CP signs for the lock, remains responsible for it and retains its key. Credentials and contact information are entered in the app.</p></article><article class="panel"><span class="eyebrow">RULE 04</span><h3>Numbered SLD references</h3><p>Approved SLDs displayed in the AP office show a small numbered circle at each relevant switch, circuit breaker and earth switch. The circle identifies the dedicated lock assigned to that point.</p></article></div><div class="note"><strong>Before first use:</strong><p>Verify the drawing revision, the apparatus identification and each lock/number mapping under the approved site procedure. The diagram and app are references, not substitutes for physical verification.</p></div><a class="btn primary small guide-next" href="guide-cabinet.html">Next: The four cabinets →</a></div></template>
