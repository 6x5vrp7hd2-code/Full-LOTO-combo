<template id="gc"><div data-k="eb">11 / DIGITAL RECORD</div><div data-k="h1">How the application works</div><div data-k="lead">The app is intended to give authorised users a common view of who holds a document and where keys and boxes are allocated.</div><div data-k="body"><div class="grid two"><article class="panel"><h3>CP training and issue</h3><p>After training, each CP signs for a uniquely numbered personal safety lock. Their name, employer, credentials, authorisation details and contact information are registered. The CP keeps their personal-lock key.</p></article><article class="panel"><h3>Before issuing a document</h3><p>The AP checks the POIs against the SLD and recorded key locations. A missing key must be investigated; a document cannot be issued if the necessary key cannot be accounted for.</p></article><article class="panel"><h3>Safety-document entry</h3><p>Record document type, work activity, asset, issuing AP, receiving CP, issue date/time, planned duration, lockout box and associated isolation keys. The intended production system shares updates with all authorised users.</p></article><article class="panel"><h3>Find the responsible person</h3><p>Authorised users can look up the live document and contact its named CP/AP without searching for paper copies or relying on informal handovers.</p></article><article class="panel"><h3>Overdue document alerts</h3><p>When a document exceeds its allocated duration (for example 24 or 36 hours), an alert appears on the opening dashboard, prompting the AP to contact the CP and establish the reason.</p></article><article class="panel"><h3>Cancellation and reset</h3><p>After physical locks, keys and the safety document have been reconciled under site rules, the AP updates the app to reflect the cancelled document and the returned items.</p></article><article class="panel"><h3>Control centre</h3><p>The opening view for the AP office: new requests, active documents, clearance deadlines, expired documents, today’s planned work and unresolved conflicts, with every register below.</p></article><article class="panel"><h3>Document requests</h3><p>The register of contractor requests, with their status and programme check. Contractors see only their own.</p></article><article class="panel"><h3>Daily programme</h3><p>The published activities for the day. Tap one to see its equipment, deadline, documents and related requests.</p></article><article class="panel"><h3>Clearance deadlines</h3><p>Each activity with a target time, the documents outstanding against it and who holds them.</p></article><article class="panel"><h3>Equipment availability</h3><p>Select an item to see its planning status, requests, documents, keys, activities and connected equipment in one place.</p></article><article class="panel"><h3>Changing role in the demonstration</h3><p>The View as menu shows the application as a contractor, AP/SAP, Lead SAP or Control Engineer, or manager. It is a demonstration aid, not a login.</p></article></div><div class="warning"><strong>Important technical distinction:</strong> The demonstration saves its records in one browser only, using example data. It has no shared database or real logins, so a contractor’s request does not reach another device. Secure, shared live records are a required production capability, not a feature of the demonstration.</div><a class="btn primary small guide-next" href="guide-drawings.html">Next: Drawing-linked isolation status →</a></div></template>
