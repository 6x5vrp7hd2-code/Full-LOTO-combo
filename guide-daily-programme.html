<template id="gc"><div data-k="eb">05 / DAILY OPERATIONAL CONTROL</div><div data-k="h1">The daily programme</div><div data-k="lead">One shared view of what must happen today, so nobody issues a document that clashes with what was agreed at the morning meeting.</div><div data-k="body"><div class="timeline"><article class="timeline-item"><span class="step-num">01</span><div><h3>Morning coordination meeting</h3><p>The Lead SAP or Control Engineer attends and agrees the main requirements of the day, such as energisations and isolations needed for commissioning.</p></div></article><article class="timeline-item"><span class="step-num">02</span><div><h3>Enter the activities</h3><p>Each activity records the equipment, the scheduled time, who is responsible, how long the equipment stays restricted, and a clearance deadline where documents must be cleared first.</p></div></article><article class="timeline-item"><span class="step-num">03</span><div><h3>Publish</h3><p>The entries stay in draft until they are published. The AP office sees only the published revision, and the programme checks use only the published revision.</p></div></article><article class="timeline-item"><span class="step-num">04</span><div><h3>Republish when the plan changes</h3><p>Plans move during the day. Each change is published as a new revision, with the name and time recorded.</p></div></article></div><h2>What each planning status means</h2><div class="table-wrap"><table class="info"><thead><tr><th>Status</th><th>Meaning</th></tr></thead><tbody><tr><td data-label="Status">Available for assessment</td><td data-label="Meaning">No programme restriction or active document is recorded.</td></tr><tr><td data-label="Status">Reserved for commissioning</td><td data-label="Meaning">A planned commissioning or testing activity may stop the equipment being released.</td></tr><tr><td data-label="Status">Planned isolation</td><td data-label="Meaning">An isolation is scheduled.</td></tr><tr><td data-label="Status">Planned energisation</td><td data-label="Meaning">The equipment is needed for energisation.</td></tr><tr><td data-label="Status">Restricted</td><td data-label="Meaning">A restriction is recorded. Release needs it to be reviewed.</td></tr><tr><td data-label="Status">Under active safety document</td><td data-label="Meaning">A safety document is recorded against this equipment.</td></tr></tbody></table></div><div class="warning"><strong>These are planning indicators, not electrical states.</strong><p>“Available for assessment” does not mean safe, dead or free to use. It only means nothing is recorded. Equipment is always confirmed physically under the site rules.</p></div><div class="note"><strong>If today’s programme has not been published:</strong><p>The application shows a warning and treats checks as not done. An empty programme must never be read as a clear day.</p></div><div class="grid two"><article class="panel"><h3>Finding the programme</h3><p>Open Daily programme from the menu. Tap any activity to see its equipment, deadline, linked documents and related contractor requests.</p></article><article class="panel"><h3>If the system is unavailable</h3><p>The programme can be printed. The site needs an agreed outage procedure before live use, and the paper copy must show its revision.</p></article></div><a class="btn primary small guide-next" href="guide-document-requests.html">Next: Document requests →</a></div></template>
