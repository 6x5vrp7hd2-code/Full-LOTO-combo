<template id="gc"><div data-k="eb">06 / BEFORE ANY DOCUMENT</div><div data-k="h1">Document requests</div><div data-k="lead">No safety document is considered until a contractor’s request has reached the AP office and been reviewed.</div><div data-k="body"><ol class="flow"><li>Contractor submits</li><li>AP/SAP reviews</li><li>Programme check</li><li>Decision</li><li>Isolation planning</li><li>Safety document</li></ol><h2>What the contractor provides</h2><div class="grid two"><article class="panel"><h3>Who</h3><p>Contractor, requesting person, contact details and the proposed recipient (CP).</p></article><article class="panel"><h3>What</h3><p>The document needed (HV PTW, LV PTW, SFT or LOA), the work location, a description of the work and the RAMS reference.</p></article><article class="panel"><h3>Which equipment</h3><p>Chosen from a list, not typed. Free text could hide a conflict because two names might describe the same asset.</p></article><article class="panel"><h3>When</h3><p>The date and time the document is required from and until.</p></article></div><div class="note"><strong>Each request receives a unique reference.</strong><p>For example, DR-2026-0048. The issued safety document keeps this reference, so every document traces back to its request.</p></div><h2>What the AP or SAP checks</h2><div class="panel"><ul><li>The proposed work activity is sufficiently described.</li><li>The RAMS and supporting information are suitable.</li><li>The equipment is correctly identified.</li><li>The proposed recipient is appropriately authorised.</li><li>The requested isolation does not conflict with existing documents.</li><li>The programme check has been reviewed.</li><li>The work can be accommodated within the operational programme.</li></ul></div><h2>The four outcomes</h2><div class="table-wrap"><table class="info"><thead><tr><th>Decision</th><th>What happens next</th></tr></thead><tbody><tr><td data-label="Decision">Accept for planning</td><td data-label="What happens next">The request moves on to isolation planning.</td></tr><tr><td data-label="Decision">Request information</td><td data-label="What happens next">It returns to the contractor with a comment. Their reply brings it back to the AP office.</td></tr><tr><td data-label="Decision">Defer</td><td data-label="What happens next">It is held because of an operational or programme constraint, and can be reopened later.</td></tr><tr><td data-label="Decision">Decline</td><td data-label="What happens next">It is closed with a recorded reason. The contractor can submit a new request.</td></tr></tbody></table></div><div class="warning"><strong>Accepted does not mean permitted.</strong><p>Accepted for planning means enough information has been provided to start planning. It is not permission to work, and it is not authority to issue a safety document.</p></div><a class="btn primary small guide-next" href="guide-programme-checks.html">Next: Programme checks →</a></div></template>
