<template id="gc"><div data-k="eb">13 / ASSURANCE</div><div data-k="h1">Safety, security and deployment</div><div data-k="lead">The physical process and application must both be validated before use on a live electrical system.</div><div data-k="body"><div class="grid two"><article class="panel"><h3>Physical operating controls</h3><ul><li>Approved electrical safety rules and roles for APs, SAPs and CPs.</li><li>Verified numbering and location of all locks, keys, boxes and apparatus.</li><li>Each authorised AP/SAP signs for and guards their own Cabinet 4 key.</li><li>Defined response to missing keys, lock discrepancies and lost personal keys.</li><li>Document issue/cancellation and physical reconciliation procedures.</li><li>Agreed authority for who reviews requests, publishes the programme and resolves conflicts.</li><li>An outage procedure and paper fallback for the request and programme stages.</li></ul></article><article class="panel"><h3>Digital security controls</h3><ul><li>Verified individual user identities and appropriate role-based access.</li><li>Encrypted data and secure hosting with client-specific separation.</li><li>Tamper-evident audit records for key/document changes.</li><li>Reliable shared synchronisation, conflict handling and offline failure procedures.</li><li>A connection map verified against approved drawings, and retested when they change.</li><li>A restricted contractor view that hides unrelated documents, drawings and other contractors’ information.</li><li>Access-approved drawings and protected personnel contact data.</li><li>Independent security testing, incident response and recovery arrangements.</li></ul></article></div><div class="note"><strong>Proposed, not implemented:</strong><p>A separate cybersecurity assurance proposal exists for the platform. Its proposed controls require implementation, testing and client acceptance. Neither this guide nor the demonstration establishes compliance or permission for production deployment.</p></div><a class="btn primary small guide-next" href="guide-video.html">Next: Engineer induction and client explanation →</a></div></template>
