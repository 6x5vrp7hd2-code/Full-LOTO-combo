<template id="gc"><div data-k="eb">09 / DAILY OPERATIONAL CONTROL</div><div data-k="h1">Clearance deadlines</div><div data-k="lead">A clearance deadline shows which documents must be reviewed for cancellation before a planned activity can go ahead.</div><div data-k="body"><h2>Expired is not the same as a clearance deadline</h2><div class="table-wrap"><table class="info"><thead><tr><th></th><th>Expired document</th><th>Clearance deadline</th></tr></thead><tbody><tr><td data-label="">What it means</td><td data-label="Expired document">The document has passed its recorded planned duration.</td><td data-label="Clearance deadline">The document must be reviewed for cancellation before an upcoming activity.</td></tr><tr><td data-label="">Where it comes from</td><td data-label="Expired document">The time recorded when the document was issued.</td><td data-label="Clearance deadline">The published daily programme.</td></tr><tr><td data-label="">What you do</td><td data-label="Expired document">Contact the recipient and establish the reason.</td><td data-label="Clearance deadline">Contact the recipient early enough to meet the target.</td></tr></tbody></table></div><h2>What you will see</h2><div class="mock"><p class="mock-tag">ILLUSTRATIVE EXAMPLE ONLY</p><div class="mock-head"><div><h3>Energise Transformer 2</h3><p>Transformer 2</p></div><span class="chip s-warn">Due soon</span></div><div class="mock-times"><span><small>Planned start</small><b>14:00</b></span><span><small>Clearance target</small><b>12:00</b></span><span><small>Outstanding</small><b>3</b></span></div><div class="table-wrap"><table class="info"><thead><tr><th>Document</th><th>Recipient</th><th>Status</th></tr></thead><tbody><tr><td data-label="Document">HV PTW 0042</td><td data-label="Recipient">CP 14</td><td data-label="Status">Live</td></tr><tr><td data-label="Document">SFT 0018</td><td data-label="Recipient">CP 27</td><td data-label="Status">Live</td></tr><tr><td data-label="Document">LOA 0009</td><td data-label="Recipient">CP 06</td><td data-label="Status">Live</td></tr></tbody></table></div></div><div class="table-wrap"><table class="info"><thead><tr><th>Status</th><th>Meaning</th></tr></thead><tbody><tr><td data-label="Status"><span class="chip s-crit">Overdue</span></td><td data-label="Meaning">The target has passed and documents are still recorded.</td></tr><tr><td data-label="Status"><span class="chip s-warn">Due soon</span></td><td data-label="Meaning">The target is within two hours and documents are still recorded.</td></tr><tr><td data-label="Status">Planned</td><td data-label="Meaning">The target is more than two hours away.</td></tr><tr><td data-label="Status"><span class="chip s-good">No documents recorded</span></td><td data-label="Meaning">Nothing is recorded against the equipment. Physical checks are still required.</td></tr></tbody></table></div><div class="grid two"><article class="panel"><h3>Finding the recipient</h3><p>Open the document from the list to reach the recipient’s details. If a phone number is missing, add it to the CP register so the next person is not left searching.</p></article><article class="panel"><h3>Documents marked as same network</h3><p>These are listed for you to check, but they do not count as outstanding. They share a ring or feeder group with the activity.</p></article></div><div class="warning"><strong>A deadline never cancels a document.</strong><p>The application will not cancel a document or show equipment as available because a deadline has passed. Passing a deadline does not allow any lock to be removed. Cancellation stays subject to the safety rules and physical checks.</p></div><a class="btn primary small guide-next" href="guide-a-day-on-site.html">Next: A day on site →</a></div></template>
